name: Build Custom Hex

on:
  workflow_dispatch:
  push:
    branches:
      - vtx-d1-patch

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Arm GNU Toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '10.3-2021.10'

      - name: Compile Target
        run: |
          make TARGET=HOBBYWING_XROTORF7CONV

      - name: Upload Hex Artifact
        uses: actions/upload-artifact@v4
        with:
          name: betaflight_HOBBYWING_XROTORF7CONV
          path: obj/betaflight_*.hex
