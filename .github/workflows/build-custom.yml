name: Build Custom Hex

on:
  workflow_dispatch:
  push:
    branches:
      - vtx-d1-patch

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y make curl tar xz-utils python3 python3-pip
          pip3 install jinja2 pyyaml

      - name: Install Required Arm Toolchain
        run: |
          make arm_sdk_install
          echo "$HOME/opt/gcc-arm-none-eabi/bin" >> $GITHUB_PATH

      - name: Compile Target
        run: |
          export PATH="$HOME/opt/gcc-arm-none-eabi/bin:$PATH"
          arm-none-eabi-gcc --version
          make HOBBYWING_XROTORF7CONV

      - name: Upload Hex Artifact
        uses: actions/upload-artifact@v4
        with:
          name: betaflight_HOBBYWING_XROTORF7CONV
          path: |
            obj/*.hex
            obj/*.bin
