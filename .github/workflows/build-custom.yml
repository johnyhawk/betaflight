name: Build Custom Hex

on:
  workflow_dispatch:
  push:
    branches:
      - vtx-d1-patch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install ARM Toolchain and Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi make

      - name: Compile Target
        run: |
          make TARGET=HOBBYWING_XROTORF7CONV

      - name: Upload Hex Artifact
        uses: actions/upload-artifact@v4
        with:
          name: betaflight_HOBBYWING_XROTORF7CONV
          path: obj/*.hex
