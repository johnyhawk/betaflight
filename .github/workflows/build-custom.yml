name: Build Custom Hex

on:
  workflow_dispatch:
  push:
    branches:
      - vtx-d1-patch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Firmware
        uses: betaflight/compile-action@v1
        with:
          target: HOBBYWING_XROTORF7CONV

      - name: Upload Hex Artifact
        uses: actions/upload-artifact@v4
        with:
          name: betaflight_HOBBYWING_XROTORF7CONV
          path: obj/*.hex
