name: Build Custom Hex

on:
  workflow_dispatch:
  push:
    branches:
      - vtx-d1-patch

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            python3 \
            python3-pip \
            python3-jinja2 \
            python3-yaml \
            ruby \
            ninja-build

      - name: Show Compiler Version
        run: |
          arm-none-eabi-gcc --version

      - name: Compile Target
        run: |
          make TARGET=HOBBYWING_XROTORF7CONV

      - name: Upload Hex Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: betaflight_HOBBYWING_XROTORF7CONV
          path: obj/*.hex
