name: Build Custom Hex

on:
  workflow_dispatch:
  push:
    branches:
      - vtx-d1-patch

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y make curl tar xz-utils python3 python3-pip
          pip3 install jinja2 pyyaml

      - name: Install Arm GNU Toolchain 13.3.rel1
        run: |
          sudo mkdir -p /opt/arm-gcc
          curl -sSL "https://developer.arm.com/-/media/Files/downloads/gnu/13.3.rel1/binrel/arm-gnu-toolchain-13.3.rel1-x86_64-arm-none-eabi.tar.xz" | sudo tar -xJ -C /opt/arm-gcc --strip-components=1
          echo "/opt/arm-gcc/bin" >> $GITHUB_PATH

      - name: Inject Navigation and GPS Features into Target Config
        run: |
          cat << 'CONFIG_EOF' >> src/config/configs/HOWI/HOBBYWING_XROTORF7CONV/config.h
          #define USE_GPS
          #define USE_GPS_RESCUE
          #define USE_GPS_UBLOX
          #define USE_GPS_NMEA
          #define USE_MAG
          #define USE_MAG_QMC5883
          #define USE_NAV
          #define USE_ALTITUDE_HOLD
          #define USE_POSITION_HOLD
          CONFIG_EOF

      - name: Compile Target
        run: |
          export PATH="/opt/arm-gcc/bin:$PATH"
          arm-none-eabi-gcc --version
          make HOBBYWING_XROTORF7CONV

      - name: Upload Hex Artifact
        uses: actions/upload-artifact@v4
        with:
          name: betaflight_HOBBYWING_XROTORF7CONV
          path: |
            obj/*.hex
            obj/*.bin
