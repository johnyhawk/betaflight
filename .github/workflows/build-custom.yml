name: Build Custom Hex

on:
  workflow_dispatch:
  push:
    branches:
      - vtx-d1-patch

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Tools & Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y make curl tar bzip2 xz-utils python3 python3-pip
          pip3 install jinja2 pyyaml
          # Download official Arm GNU Toolchain 10.3 (standard for Betaflight STM32F7 builds)
          curl -sSL "https://developer.arm.com/-/media/Files/downloads/gnu-rm/10.3-2021.10/gcc-arm-none-eabi-10.3-2021.10-x86_64-linux.tar.bz2" | tar -xj -C /opt
          echo "/opt/gcc-arm-none-eabi-10.3-2021.10/bin" >> $GITHUB_PATH

      - name: Compile Target
        run: |
          export PATH="/opt/gcc-arm-none-eabi-10.3-2021.10/bin:$PATH"
          arm-none-eabi-gcc --version
          make HOBBYWING_XROTORF7CONV

      - name: Locate & Upload Hex Artifact
        uses: actions/upload-artifact@v4
        with:
          name: betaflight_HOBBYWING_XROTORF7CONV
          path: |
            obj/*.hex
            obj/*.bin
